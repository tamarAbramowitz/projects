<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ספר המתכונים - תצוגת מתכון</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <button id="backBtn" class="btn btn-outline">← חזור לרשימה</button>
            <h1 id="recipeTitle">מתכון</h1>
            <div class="header-actions">
                <button id="settingsBtn" class="btn btn-secondary">⚙️ הגדרות</button>
                <button id="logoutBtn" class="btn btn-outline">יציאה</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="recipe-view">
            <div class="recipe-header">
                <img id="recipeImage" src="" alt="תמונת המתכון" class="recipe-image">
                <div class="recipe-info">
                    <h2 id="recipeNameDisplay"></h2>
                    <p class="recipe-time">⏱️ זמן הכנה: <span id="recipeTimeDisplay"></span> דקות</p>
                </div>
            </div>

            <div class="recipe-content">
                <div class="ingredients-section">
                    <h3>🥘 רכיבים</h3>
                    <ul id="ingredientsList"></ul>
                </div>

                <div class="instructions-section">
                    <h3>👨‍🍳 הוראות הכנה</h3>
                    <div class="voice-controls">
                        <button id="playBtn" class="btn btn-success">▶️ התחל הקראה</button>
                        <button id="pauseBtn" class="btn btn-warning" style="display: none;">⏸️ עצור</button>
                        <button id="stopBtn" class="btn btn-danger" style="display: none;">⏹️ סיום</button>
                        <button id="prevBtn" class="btn btn-secondary" style="display: none;">⏮️ קודם</button>
                        <button id="nextBtn" class="btn btn-secondary" style="display: none;">⏭️ הבא</button>
                    </div>
                    <div class="current-step-indicator">
                        <span id="stepCounter">שלב 0 מתוך 0</span>
                    </div>
                    <ol id="instructionsList"></ol>
                </div>
            </div>
        </div>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
